<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1728"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#132238"/><stop offset="1" stop-color="#0c1727"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#e5edf8}.muted{fill:#8ca0b8}.green{fill:#54d38a}.yellow{fill:#fbbf24}.h1{font-size:42px;font-weight:800}.h2{font-size:25px;font-weight:750}.tag{font-size:14px;font-weight:800;letter-spacing:1.5px}.body{font-size:16px}.small{font-size:14px}.metric{font-size:30px;font-weight:800}.label{font-size:13px;fill:#8ca0b8}.card{fill:url(#card);stroke:#263b55;stroke-width:1.5}.panel{fill:#091422}.pill{fill:#17263a;stroke:#2d435e}</style></defs>
<rect width="1440" height="1200" fill="url(#bg)"/><text x="90" y="75" class="green tag">BR FANTASY · ANALYTICS LAB · ARTIFACT</text><text x="90" y="128" class="h1">Decisions, with the “why” visible.</text><text x="90" y="165" class="muted body">Mockups for empirical replacement, confidence, roster profiles, calibrated weights, and model health.</text>
<!-- card 4 --><rect x="90" y="215" width="610" height="300" rx="18" class="card"/><text x="120" y="255" class="green tag">4 · DRAFT ASSISTANT</text><text x="120" y="295" class="h2">Empirical replacement level</text><text x="120" y="325" class="muted small">Your actual player pool fills every league-wide starter slot.</text>
<g transform="translate(120 355)"><rect width="125" height="40" rx="20" class="pill"/><text x="17" y="26" class="small">SF → QB 92%</text><rect x="140" width="145" height="40" rx="20" class="pill"/><text x="157" y="26" class="small">FLEX → WR 58%</text><rect x="300" width="145" height="40" rx="20" class="pill"/><text x="317" y="26" class="small">FLEX → RB 36%</text></g><rect x="120" y="425" width="550" height="62" rx="9" class="panel"/><rect x="120" y="425" width="4" height="62" fill="#54d38a"/><text x="140" y="450" class="small">Recommendation changed: QB replacement is QB24,</text><text x="140" y="473" class="muted small">not the fixed half-slot estimate of QB18.</text>
<!-- card 5 --><rect x="740" y="215" width="610" height="300" rx="18" class="card"/><text x="770" y="255" class="green tag">5 · EVERY RECOMMENDATION</text><text x="770" y="295" class="h2">Confidence &amp; rank stability</text><text x="770" y="325" class="muted small">Completeness and historical support, not an arbitrary badge.</text><g transform="translate(770 350)"><rect width="165" height="90" rx="10" class="panel"/><text x="18" y="42" class="metric">#4</text><text x="18" y="68" class="label">Waiver rank</text><rect x="180" width="165" height="90" rx="10" class="panel"/><text x="198" y="42" class="green metric">High</text><text x="198" y="68" class="label">86 confidence</text><rect x="360" width="165" height="90" rx="10" class="panel"/><text x="378" y="42" class="metric">#3–6</text><text x="378" y="68" class="label">Likely range</text><rect y="110" width="525" height="9" rx="5" fill="#24364d"/><rect y="110" width="452" height="9" rx="5" fill="#54d38a"/></g>
<!-- card 6/7 --><rect x="90" y="555" width="1260" height="285" rx="18" class="card"/><text x="120" y="595" class="green tag">6 + 7 · TEAMS</text><text x="120" y="635" class="h2">WR room · explainable strength profile</text><text x="120" y="665" class="muted small">The calibrated composite stays sortable; its independent ingredients explain the grade.</text><g transform="translate(120 690)"><rect width="370" height="95" rx="10" class="panel"/><text x="20" y="46" class="metric">812</text><text x="20" y="72" class="label">Starter strength · 62% weight</text><rect x="395" width="370" height="95" rx="10" class="panel"/><text x="415" y="46" class="metric">536</text><text x="415" y="72" class="label">Depth strength · 23% weight</text><rect x="790" width="370" height="95" rx="10" class="panel"/><text x="810" y="46" class="yellow metric">31%</text><text x="810" y="72" class="label">Fragility · 15% weight</text></g><text x="120" y="817" class="small"><tspan font-weight="700">Why B+?</tspan> Elite starting WRs and above-average depth, but losing WR1 drops the room below average. Confidence: High.</text>
<!-- card 9 --><rect x="90" y="880" width="1260" height="260" rx="18" class="card"/><text x="120" y="920" class="green tag">9 · MODEL HEALTH</text><text x="120" y="958" class="h2">Decision-quality scorecard</text><text x="120" y="985" class="muted small">Each feature is judged by the metric matching the decision it makes.</text><g class="small"><text x="120" y="1025" class="muted">FEATURE</text><text x="370" y="1025" class="muted">PRIMARY METRIC</text><text x="750" y="1025" class="muted">CURRENT</text><text x="930" y="1025" class="muted">BASELINE</text><text x="1130" y="1025" class="muted">STATUS</text><path d="M120 1038H1320" stroke="#263b55"/><text x="120" y="1068">Draft Assistant</text><text x="370" y="1068">Value over alternative</text><text x="750" y="1068">+8.4%</text><text x="930" y="1068">ADP only</text><text x="1130" y="1068" class="green">Passing</text><text x="120" y="1105">Waivers</text><text x="370" y="1105">Precision@5</text><text x="750" y="1105">42%</text><text x="930" y="1105">31%</text><text x="1130" y="1105" class="green">+11 pts</text></g>
</svg>
