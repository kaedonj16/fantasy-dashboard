name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    name: Python lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      # Several "Python" parity tests execute the production JS kernels through
      # Node. ubuntu-latest currently happens to include Node, but relying on the
      # runner image made those tests skip or change behavior as images rolled.
      - name: Set up Node for parity tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Ruff and pytest
        run: uv pip install --system ruff pytest

      - name: Lint for real bugs (syntax errors, undefined names)
        # Scoped to high-signal pyflakes/pycodestyle-error rules so CI flags
        # genuine bugs without failing on the existing code's style choices. On
        # top of the syntax/undefined-name core (E9,F63,F7,F82) this also catches:
        #   E711/E713/E714  bad None / membership / identity comparisons
        #   F404            late __future__ import
        #   F50*,F52*       %- and str.format() argument mismatches
        #   F811            redefinition of an unused name (dup import / shadow)
        #   W605            invalid escape sequence (e.g. an unescaped regex)
        # The whole set is at zero violations today; it only guards the future.
        run: ruff check --select E9,E711,E713,E714,F63,F7,F82,F404,F50,F52,F811,W605 --output-format=github .

      - name: Compile all Python (syntax check)
        run: python -m compileall -q app.py dashboard_services data_building routes models utils scripts

      - name: Run unit tests
        # Pure-Python only. Flask/pandas tests are marked `integration` and run
        # in the full-stack job so this one stays a fast syntax/logic gate.
        run: python -m pytest tests/ -q -m "not integration"

  integration:
    name: Integration tests (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Set up Node for parity tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # The web app and its page-render tests need the full Flask + scientific
        # stack, so unlike the lint job we install requirements.txt here. Two
        # pinned sdists (pywebpush, requests-html) fail to build on some
        # toolchains and aren't needed to import or test the web app, so they're
        # excluded — mirrors scripts/dev_setup.sh. The single test that needs
        # pywebpush importorskips itself. uv is substantially faster than pip
        # on this stack (wheels + its own cache).
        run: |
          grep -viE '^(pywebpush|requests-html)' requirements.txt > /tmp/req-ci.txt
          uv pip install --system -r /tmp/req-ci.txt pytest

      - name: Run integration tests
        # Only tests that need Flask/pandas. Unit tests already ran in the lint
        # job. offline_client stubs Sleeper + Tank01 so page renders stay offline.
        env:
          FLASK_SECRET_KEY: dev
        run: python -m pytest tests/ -q -m integration --tb=short

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check static JS
        run: |
          status=0
          for f in static/*.js; do
            echo "Checking $f"
            node --check "$f" || status=1
          done
          exit $status
