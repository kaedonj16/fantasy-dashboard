name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    name: Python lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Lint for real bugs (syntax errors, undefined names)
        # Scoped to the high-signal pyflakes/pycodestyle-error rules so CI flags
        # genuine bugs without failing on the existing code's style choices.
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Compile all Python (syntax check)
        run: python -m compileall -q app.py dashboard_services data_building routes models utils scripts

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check static JS
        run: |
          status=0
          for f in static/*.js; do
            echo "Checking $f"
            node --check "$f" || status=1
          done
          exit $status
