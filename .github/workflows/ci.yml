name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    name: Python lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Lint for real bugs (syntax errors, undefined names)
        # Scoped to the high-signal pyflakes/pycodestyle-error rules so CI flags
        # genuine bugs without failing on the existing code's style choices.
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Compile all Python (syntax check)
        run: python -m compileall -q app.py dashboard_services data_building routes models utils scripts

      - name: Run unit tests
        # The suite is pure-Python (no pandas/DB needed); app-dependent tests
        # skip cleanly when the full stack isn't installed. Guards the model
        # logic (waiver_score, tiers, pick_score, ...) and the CSS/JS health
        # ratchets on every push.
        run: |
          pip install pytest
          python -m pytest tests/ -q

  integration:
    name: Integration tests (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # The web app and its page-render tests need the full Flask + scientific
        # stack, so unlike the lint job we install requirements.txt here. Two
        # pinned sdists (pywebpush, requests-html) fail to build on some
        # toolchains and aren't needed to import or test the web app, so they're
        # excluded — mirrors scripts/dev_setup.sh. The single test that needs
        # pywebpush importorskips itself.
        run: |
          python -m pip install -U pip
          grep -viE '^(pywebpush|requests-html)' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt pytest

      - name: Run full test suite (incl. integration pages)
        # No DATABASE_URL and no network: the offline_client fixture mocks the
        # Sleeper API and the pages degrade gracefully, so the page-render tests
        # run offline. This is the job that catches url_for / BuildError-class
        # regressions from route extraction that the pure-Python lint job cannot.
        env:
          FLASK_SECRET_KEY: dev
        run: python -m pytest tests/ -q

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check static JS
        run: |
          status=0
          for f in static/*.js; do
            echo "Checking $f"
            node --check "$f" || status=1
          done
          exit $status
