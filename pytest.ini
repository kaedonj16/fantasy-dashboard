[pytest]
# The unit suite lives in tests/. Scope bare `pytest` there so it doesn't wander
# into data_building/ manual smoke scripts (which hit the live DB/network and are
# named test_* only by convention). Target those explicitly when you mean to.
testpaths = tests
# Keep repository packages importable whether CI invokes `pytest` directly or
# via `python -m pytest` (the latter otherwise happens to add the cwd itself).
pythonpath = .
markers =
    integration: needs Flask/pandas (CI full-stack job)
