---
services:
  - type: web
    name: brfantasy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python startup.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
    autoDeploy: true
  - type: cron
    name: daily-job
    runtime: python
    schedule: 0 8 * * *
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_daily.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString

databases:
  - name: brfantasy-db
    databaseName: brfantasy
    user: brfantasy_user
    plan: starter