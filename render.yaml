---
services:
  - type: web
    name: brfantasy
    runtime: python
    plan: free
    # OG image rendering (Playwright/Chromium) is intentionally excluded from the
    # web-service build — the free-plan instance has only 512 MB RAM, and launching
    # a headless browser pushes it into OOM territory, killing gunicorn workers and
    # making all page loads hang. og_render.py degrades gracefully to the static
    # logo when Playwright is unavailable, so share links still work.
    # To re-enable OG renders, upgrade to a plan with ≥ 2 GB RAM and add:
    #   && python -m playwright install chromium
    buildCommand: pip install -r requirements.txt
    startCommand: python startup.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: EMAIL_USER
        value: kjenkins3232@gmail.com
      - key: EMAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: kjenkins3232@gmail.com
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: TANK01_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      # Gates admin-only data-management endpoints (rookie prospect writes,
      # sleeper linking, pipeline refresh). If unset, those endpoints are disabled.
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: PYTHON_ENV
        value: production
      - key: TZ
        value: America/New_York
      - key: PRIMARY_DOMAIN
        value: brfantasyfootball.com
      # AI features
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Push notifications
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # ESPN league imports
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      # Yahoo OAuth
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        value: https://brfantasy.onrender.com/auth/yahoo/callback
      # Stripe payments
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Rookie data pipeline
      - key: SPORTRADAR_API_KEY
        sync: false
    autoDeploy: true
  - type: cron
    name: daily-job
    runtime: python
    schedule: 0 8 * * *
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python cron_daily.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # The cron container checks out the repo fresh each run, giving committed
      # build artifacts (model_values.json, vendor CSVs) a "today" mtime. That
      # fools the mtime freshness guards into skipping the rebuild and syncing
      # stale values. Force a full rebuild every cron run so the basket-anchored
      # model values (top players above 999.9) are regenerated and persisted.
      - key: CRON_FORCE_REBUILD
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: EMAIL_USER
        value: kjenkins3232@gmail.com
      - key: EMAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: kjenkins3232@gmail.com
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: TANK01_API_KEY
        sync: false
      - key: PYTHON_ENV
        value: production
      # Cache-flush after each cron run — most critical missing vars
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TZ
        value: America/New_York
      # AI market-pulse blurbs
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Push notifications
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Rookie pipeline data sources
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        sync: false
      - key: CFBD_API_KEY
        sync: false

  - type: cron
    name: trade-recrawl
    runtime: python
    # Every 4 hours. Grows the league pool (discovery) AND re-crawls known
    # leagues for fresh trades, so the pool both expands and stays current
    # instead of only crawling new leagues once at discovery time.
    schedule: 0 */4 * * *
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python scripts/refresh_trade_intel.py --discover-target 500 --batch-size 2000 --workers 4 --crawl-mode both --recrawl-days 2 --analytics
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: TANK01_API_KEY
        sync: false
      - key: PYTHON_ENV
        value: production

  - type: cron
    name: league-discovery
    runtime: python
    # Daily at 6am — BFS-expands the league pool via Sleeper API (no Playwright needed).
    # Runs before the 8am daily-job so freshly discovered leagues are available sooner.
    schedule: 0 6 * * *
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/discover_leagues.py --target 2000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: PYTHON_ENV
        value: production

databases:
  - name: brfantasy-db
    databaseName: brfantasy
    user: brfantasy_user