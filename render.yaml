---
services:
  - type: web
    name: brfantasy
    runtime: python
    plan: free
    # Playwright/Chromium is only used by the offline data pipeline (cron),
    # not the web service — keep it out of the web build.
    buildCommand: pip install -r requirements.txt
    startCommand: python startup.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: EMAIL_USER
        value: kjenkins3232@gmail.com
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: kjenkins3232@gmail.com
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: TANK01_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      # Gates admin-only data-management endpoints (rookie prospect writes,
      # sleeper linking, pipeline refresh). If unset, those endpoints are disabled.
      - key: ADMIN_KEY
        sync: false
      - key: PYTHON_ENV
        value: production
    autoDeploy: true
  - type: cron
    name: daily-job
    runtime: python
    schedule: 0 8 * * *
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python cron_daily.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: EMAIL_USER
        value: kjenkins3232@gmail.com
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: kjenkins3232@gmail.com
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: TANK01_API_KEY
        sync: false
      - key: PYTHON_ENV
        value: production

  - type: cron
    name: trade-recrawl
    runtime: python
    # Every 6 hours. Re-crawls already-known leagues so new trades in the
    # existing pool are picked up continuously, not just once at discovery.
    schedule: 0 */6 * * *
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python scripts/recrawl_existing_trades.py --analytics
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: TANK01_API_KEY
        sync: false
      - key: PYTHON_ENV
        value: production

databases:
  - name: brfantasy-db
    databaseName: brfantasy
    user: brfantasy_user
    plan: starter