---
services:
  - type: web
    name: brfantasy
    runtime: python
    plan: standard
    # Playwright/Chromium excluded from web-service build while diagnosing
    # performance issues — og_render.py degrades gracefully to the static logo.
    # Re-add `&& python -m playwright install chromium` once confirmed stable.
    # --no-cache-dir: never reuse pip's wheel cache. Render persists that cache
    # across builds, and a corrupt cached scipy wheel was failing the hash check.
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python startup.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brfantasy-redis
          type: keyvalue
          property: connectionString
      - key: EMAIL_USER
        value: kaedonj@brfantasyfootball.com
      - key: EMAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: kaedonj@brfantasyfootball.com
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      # Transactional email (weekly digest). Brevo is primary; SMTP above is fallback.
      # Only BREVO_API_KEY (and optional BREVO_WEBHOOK_SECRET) are secrets you paste
      # in the Render dashboard. Sender identity is pinned here.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@brfantasyfootball.com
      - key: BREVO_SENDER_NAME
        value: BR Fantasy
      - key: BREVO_REPLY_TO_EMAIL
        value: noreply@brfantasyfootball.com
      - key: BREVO_WEBHOOK_SECRET
        sync: false
      - key: SITE_BASE_URL
        value: https://brfantasyfootball.com
      - key: FLASK_SECRET_KEY
        sync: false
      # Encrypts user-supplied private provider cookies at rest. Render creates
      # and retains this value; it must remain stable so saved connections can
      # be decrypted after deploys/restarts.
      - key: PROVIDER_CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # Gates admin-only data-management endpoints (rookie prospect writes,
      # sleeper linking, pipeline refresh). If unset, those endpoints are disabled.
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      # Shared with cron jobs (cache flush, hourly/weekly notification triggers).
      - key: CRON_SECRET
        sync: false
      - key: PYTHON_ENV
        value: production
      - key: TZ
        value: America/New_York
      - key: PRIMARY_DOMAIN
        value: brfantasyfootball.com
      # AI features
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Push notifications
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # ESPN league imports
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      # Google account sign-in. The client credentials are secrets configured in
      # Render; the callback is intentionally pinned to the canonical host so it
      # exactly matches the URI registered in Google Cloud Console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://brfantasyfootball.com/auth/google/callback
      # Hard cutover for personal PRO: bare Sleeper username/id sessions no
      # longer unlock user-plan subscriptions (Google account_id required).
      # Soft dual-read was the notice-period default; cutover is now enabled.
      - key: PRO_REQUIRE_GOOGLE
        value: "1"
      # Yahoo OAuth
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        # Must match the Redirect URI registered on the Yahoo app EXACTLY, and be
        # on the primary domain (the onrender.com host 301-redirects here, which
        # would break the OAuth round-trip). See PRIMARY_DOMAIN above.
        value: https://brfantasyfootball.com/auth/yahoo/callback
      - key: YAHOO_ENABLED
        value: "1"
      # Set to "1" temporarily to emit [yahoo-debug] lines in Render logs.
      - key: YAHOO_API_DEBUG
        sync: false
      # Stripe payments
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Sentry error tracking (server). Paste the DSN in the Render dashboard;
      # empty/unset keeps the app running with tracking disabled (fail-soft).
      - key: SENTRY_DSN
        sync: false
      # Rookie data pipeline
      - key: SPORTRADAR_API_KEY
        sync: false
    autoDeploy: true
  - type: cron
    name: daily-job
    runtime: python
    schedule: 0 8 * * *
    # standard (2GB) — the breakout historical-scores step peaks above the
    # starter 512Mi limit even after the column-restriction + early-free memory
    # work. Crons bill per-second of runtime, so a once-daily ~10-15min job on
    # standard costs cents/month over starter. Revert to starter if the memory
    # work later brings the peak comfortably under 512Mi.
    plan: standard
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m playwright install chromium
    startCommand: python cron_daily.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # The cron container checks out the repo fresh each run, giving committed
      # build artifacts (model_values.json, vendor CSVs) a "today" mtime. That
      # fools the mtime freshness guards into skipping the rebuild and syncing
      # stale values. Force a full rebuild every cron run so the basket-anchored
      # model values (top players above 999.9) are regenerated and persisted.
      - key: CRON_FORCE_REBUILD
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: EMAIL_USER
        value: kaedonj@brfantasyfootball.com
      - key: EMAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: kaedonj@brfantasyfootball.com
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: PYTHON_ENV
        value: production
      # Cache-flush after each cron run — most critical missing vars
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TZ
        value: America/New_York
      # AI market-pulse blurbs
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Push notifications
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Rookie pipeline data sources
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        sync: false
      - key: CFBD_API_KEY
        sync: false

  - type: cron
    name: live-advanced-metrics
    runtime: python
    # Every 15 minutes so a finished game reaches the Advanced Metrics view within
    # ~15 min instead of at the next 8am daily-job. The script is cheap on no-ops:
    # outside the reg/post season, or when no new game has finished since the last
    # run, it does almost nothing (state file + schedule read), so running it all
    # week is fine. It writes today's snapshot row via the same UPSERT path as the
    # daily job (they share resolve_adv_metrics_completed_week, so neither
    # regresses the other) and busts the app cache so the new values serve at once.
    # No Playwright / model rebuild here — Sleeper box scores + a throttled
    # nflverse pull only, which fits the starter 512Mi cap.
    schedule: "*/15 * * * *"
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m scripts.refresh_live_advanced_metrics
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: TZ
        value: America/New_York
      - key: PYTHON_ENV
        value: production
      # Cache-flush after a rebuild so freshly written metrics serve immediately.
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: scorezone-td-poller
    runtime: python
    # Server-side ScoreZone TD poll: fires push alerts even when nobody has the
    # ScoreZone page open. Hits the web service so VAPID keys stay on the app.
    # No pip install — trigger_notifications.py is stdlib urllib only. The
    # endpoint fast-exits when no NFL game is live, so idle runs cost ~1s.
    # The web-side poll also day-gates: on days with no NFL game scheduled
    # (America/New_York) it returns a skipped result immediately, so off-days
    # and the offseason cost one cheap cached scoreboard check per minute.
    # The every-minute schedule stays because cron cannot express NFL game
    # days, and UTC day-of-week subsets would break on night-game spillover.
    schedule: "* * * * *"
    plan: starter
    buildCommand: python -c "print('scorezone-td-poller - no Python deps')"
    startCommand: python scripts/trigger_notifications.py scorezone
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/New_York
      - key: PYTHON_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: hourly-notifications
    runtime: python
    # Hits the web service so VAPID keys stay on the app. No pip install —
    # trigger_notifications.py is stdlib urllib only. Minute 5 avoids colliding
    # with other top-of-hour jobs. Replaces the in-process gunicorn thread
    # (disabled when PYTHON_ENV=production).
    schedule: 5 * * * *
    plan: starter
    buildCommand: python -c "print('hourly-notifications - no Python deps')"
    startCommand: python scripts/trigger_notifications.py hourly
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/New_York
      - key: PYTHON_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: injury-flip-check
    runtime: python
    # Every 15 min so a starter/bench player flipping to Out/Doubtful/IR close
    # to kickoff alerts immediately. The check itself day-gates on the NFL
    # schedule (America/New_York): on non-game days it exits after a schedule
    # read, so running it around the clock is cheap. Separate overlap guard
    # from the per-minute scorezone poller (see push_bp) so a slow flip run
    # can never delay TD alerts.
    schedule: "*/15 * * * *"
    plan: starter
    buildCommand: python -c "print('injury-flip-check - no Python deps')"
    startCommand: python scripts/trigger_notifications.py injury
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/New_York
      - key: PYTHON_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: weekly-email
    runtime: python
    # Tuesday ~9am Eastern. Render cron expressions are UTC (TZ env does not
    # shift the schedule). 13:00 UTC is 9am EDT / 8am EST. DST cannot be
    # expressed in a single UTC cron, so this is the year-round compromise that
    # keeps the job on Tuesday morning Eastern. send_weekly_digests de-dupes
    # per account per ISO week, so a retry the same week is a no-op.
    schedule: "0 13 * * 2"
    plan: starter
    buildCommand: python -c "print('weekly-email - no Python deps')"
    startCommand: python scripts/trigger_notifications.py weekly
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/New_York
      - key: PYTHON_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: market-intelligence-refresh
    runtime: python
    schedule: 15 */4 * * *
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python scripts/refresh_market_intelligence.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: SPORTSGAMEODDS_API_KEY
        sync: false
      - key: MARKET_DEBUG_PROVIDER_RESPONSES
        value: "0"
      - key: PYTHON_ENV
        value: production

  - type: cron
    name: scorezone-store-poll
    runtime: python
    # Owns ScoreZone play-store polling (moved out of the gunicorn master, where
    # --preload deploys silently orphaned the in-app thread and froze game
    # data). One poll_once() per run; the Postgres advisory lock skips the run
    # cleanly if a previous poll is still going. No APP_URL/CRON_SECRET: this
    # talks to Postgres directly, never the web service.
    schedule: "* * * * *"
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python scripts/scorezone_poll.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: TZ
        value: America/New_York
      - key: PYTHON_ENV
        value: production

  - type: cron
    name: trade-recrawl
    runtime: python
    # Every 4 hours. Grows the league pool (discovery) AND re-crawls known
    # leagues for fresh trades, so the pool both expands and stays current
    # instead of only crawling new leagues once at discovery time.
    schedule: 0 */4 * * *
    plan: starter
    # Playwright is unused here (HTTP-only discovery + crawl). Installing
    # Chromium bloated the image and is not needed for this job.
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # batch-size 1000 (not 2000): crawler peak is per-league JSON × in-flight
    # workers. Discovery/crawl/analytics each run in their own subprocess so
    # the 512Mi starter cap is one stage at a time.
    startCommand: python scripts/refresh_trade_intel.py --discover-target 500 --batch-size 1000 --workers 4 --crawl-mode both --recrawl-days 2 --analytics
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: PYTHON_ENV
        value: production

  - type: cron
    name: league-discovery
    runtime: python
    # Daily at 6am — BFS-expands the league pool via Sleeper API (no Playwright needed).
    # Runs before the 8am daily-job so freshly discovered leagues are available sooner.
    # starter 512Mi: run_discovery caps seeds/in-flight and stream-scans Sleeper
    # bodies; --target only caps inserts, not RSS. Keep this at 1000.
    schedule: 0 6 * * *
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python scripts/discover_leagues.py --target 1000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: PYTHON_ENV
        value: production

  # Redis-compatible Key Value for cross-worker Flask-Limiter + shared caches
  # (espn draft relay). Internal-only; web service reads REDIS_URL via fromService.
  - type: keyvalue
    name: brfantasy-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # internal Render network only

  # Discord bot for the fantasy league: slash-command polls, welcome messages,
  # invite leaderboard, and weekly data-driven auto-polls from the site.
  # Code lives in discord-bot/. Fill DISCORD_TOKEN and the channel IDs in the
  # Render dashboard (sync: false below); the bot falls back to the server's
  # system channel when a channel ID is left unset.
  - type: worker
    name: fantasy-discord-bot
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r discord-bot/requirements.txt
    startCommand: python discord-bot/bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: WELCOME_CHANNEL_ID
        sync: false
      - key: ANNOUNCE_CHANNEL_ID
        sync: false
      - key: LEADERBOARD_CHANNEL_ID
        sync: false
      - key: RULES_CHANNEL_ID
        sync: false
      - key: POLLS_CHANNEL_ID
        sync: false
      - key: SEASON_WEEK1
        value: "2026-09-10"
      - key: SITE_BASE_URL
        value: https://www.brfantasyfootball.com
      - key: FANTASY_PLATFORM
        value: sleeper
      - key: FANTASY_LEAGUE_ID
        value: "1312067280816832512"
      - key: FANTASY_SEASON
        value: "2026"

  - type: cron
    name: breakout-weekly-report
    runtime: python
    # Wednesday ~9am Eastern. Render cron expressions are UTC (TZ env does
    # not shift the schedule). 13:00 UTC is 9am EDT / 8am EST. The script
    # emails the weekly breakout report: how the last 7 days of graded
    # calls did, the season record, and the calibration suggested-changes
    # plan. Read-only; it never changes scoring. When email is not
    # configured it prints the report and exits 0.
    schedule: "0 13 * * 3"
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python scripts/send_weekly_breakout_report.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: brfantasy-db
          property: connectionString
      - key: BREAKOUT_REPORT_EMAIL
        value: kaedonj@brfantasyfootball.com
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_USER
        value: kaedonj@brfantasyfootball.com
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587

databases:
  - name: brfantasy-db
    databaseName: brfantasy
    user: brfantasy_user
