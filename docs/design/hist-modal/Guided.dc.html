<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#020617; --card:#0f172a; --card-soft:#111827; --row:#0b1220;
      --ink:#e5e7eb; --ink-soft:#cbd5e1; --ink-faint:#94a3b8;
      --line:#1f2937; --line-strong:#303a4d;
      --pos:#22c55e; --pos-bg:rgba(34,197,94,.14); --pos-line:rgba(34,197,94,.32);
      --sky:#38bdf8; --amber:#f59e0b;
      --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
    a{color:var(--sky);} a:hover{color:#7dd3fc;}
    .stage{width:520px;min-height:892px;background:
      radial-gradient(120% 80% at 50% -6%, #0b1428 0%, var(--bg) 55%);
      display:flex;align-items:flex-start;justify-content:center;padding:24px 20px;}
    .card{width:412px;background:var(--card);color:var(--ink);
      border:1px solid var(--line);border-radius:20px;
      box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;}
    .muted{color:var(--ink-soft);} .faint{color:var(--ink-faint);}
    .mono{font-family:var(--mono);}
    .sec{border:1px solid var(--line);border-radius:15px;background:var(--card-soft);padding:14px 15px;}
    .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
    .sec-t{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);}
    .ico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--row);color:var(--ink-soft);flex-shrink:0;}
  </style>
</helmet>

<div class="stage">
  <div class="card">
    <!-- Header -->
    <div style="padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;">
      <span class="mono" style="font-weight:800;font-size:12px;padding:5px 9px;border-radius:8px;color:var(--pos);background:var(--pos-bg);">RB</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:18px;font-weight:800;line-height:1.1;">Bijan Robinson</div>
        <div class="mono faint" style="font-size:11px;margin-top:3px;">ATL · RB2 · ADP 1.03</div>
      </div>
      <button aria-label="Close" style="width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="padding:16px 18px 20px;display:grid;gap:12px;">
      <!-- 1. Verdict hero -->
      <div style="border:1px solid var(--pos-line);border-radius:16px;padding:18px;text-align:center;background:radial-gradient(120% 120% at 50% 0%, var(--pos-bg), rgba(34,197,94,.03));">
        <div style="display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--pos);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M6 4h12v4a6 6 0 01-12 0V4zM6 6H3v1a4 4 0 004 4M18 6h3v1a4 4 0 01-4 4"/></svg>
          History likes him here
        </div>
        <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;line-height:.8;margin:10px 0 6px;">
          <span style="font-weight:800;font-size:60px;letter-spacing:-.03em;color:var(--pos);font-variant-numeric:tabular-nums;">58</span>
          <span style="font-weight:800;font-size:22px;color:var(--ink-soft);">%</span>
        </div>
        <div class="muted" style="font-size:13px;line-height:1.4;">chance to finish a <b style="color:var(--ink);">top-12 RB</b>, based on 214 similar seasons</div>
        <div class="mono" style="display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:10.5px;font-weight:700;color:var(--pos);background:var(--pos-bg);border-radius:999px;padding:4px 11px;">
          <span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>Strong signal
        </div>
      </div>

      <!-- 2. vs market -->
      <div class="sec">
        <div class="sec-h">
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3.4" height="8"/><rect x="14" y="6" width="3.4" height="12"/></svg></span>
          <span class="sec-t">Is he worth pick 1.03?</span>
        </div>
        <div style="display:grid;gap:11px;">
          <div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;"><span style="font-size:13px;font-weight:700;">Backs like him</span><span class="mono" style="font-weight:800;color:var(--pos);">58%</span></div>
            <div style="height:10px;border-radius:999px;background:var(--row);overflow:hidden;"><div style="width:58%;height:100%;background:var(--pos);"></div></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;"><span style="font-size:13px;font-weight:700;" class="muted">Anyone at 1.03</span><span class="mono" style="font-weight:800;" class="muted">41%</span></div>
            <div style="height:10px;border-radius:999px;background:var(--row);overflow:hidden;"><div style="width:41%;height:100%;background:var(--line-strong);"></div></div>
          </div>
        </div>
        <div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);text-align:center;"><b style="color:var(--pos);">+17 points of edge.</b> History beats the room's price.</div>
      </div>

      <!-- 3. ladder chips -->
      <div class="sec">
        <div class="sec-h">
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4V10H4zM10 20h4V4h-4zM16 20h4v-7h-4z"/></svg></span>
          <span class="sec-t">Where he lands</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;">
          <div style="text-align:center;border:1px solid var(--line);border-radius:11px;padding:10px 6px;"><div class="mono faint" style="font-size:10px;font-weight:700;">TOP-5</div><div class="mono" style="font-weight:800;font-size:20px;margin-top:3px;">24%</div></div>
          <div style="text-align:center;border:1px solid var(--pos-line);border-radius:11px;padding:10px 6px;background:var(--pos-bg);"><div class="mono" style="font-size:10px;font-weight:700;color:var(--pos);">TOP-12</div><div class="mono" style="font-weight:800;font-size:20px;margin-top:3px;color:var(--pos);">58%</div></div>
          <div style="text-align:center;border:1px solid var(--line);border-radius:11px;padding:10px 6px;"><div class="mono faint" style="font-size:10px;font-weight:700;">TOP-24</div><div class="mono" style="font-weight:800;font-size:20px;margin-top:3px;">79%</div></div>
        </div>
      </div>

      <!-- 4. drill-in buttons -->
      <div style="display:grid;gap:9px;">
        <button style="text-align:left;display:flex;align-items:center;gap:11px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--card-soft);color:var(--ink);cursor:pointer;">
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M15 11a3 3 0 100-6"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/></svg></span>
          <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:700;">Closest comps</div><div class="faint" style="font-size:11.5px;margin-top:1px;">6 seasons that look just like his</div></div>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button style="text-align:left;display:flex;align-items:center;gap:11px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--card-soft);color:var(--ink);cursor:pointer;">
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 6-8"/></svg></span>
          <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:700;">The trends behind it</div><div class="faint" style="font-size:11.5px;margin-top:1px;">Capital · age · workload · offense</div></div>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
