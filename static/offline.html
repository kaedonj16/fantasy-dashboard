<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="br-theme-color" content="#0b2036">
<title>Offline · BR Fantasy</title>
<style>
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("/static/fonts/web/archivo-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("/static/fonts/web/archivo-700.woff2") format("woff2");
  }
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("/static/fonts/web/archivo-800.woff2") format("woff2");
  }
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Archivo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 6px; padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: #ffffff;
    color: #122d4b;
  }
  body.is-dark {
    background: #020617;
    color: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    body:not(.is-light) {
      background: #020617;
      color: #e2e8f0;
    }
  }
  .brand {
    margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase; color: #3b82f6;
  }
  img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; font-weight: 800; }
  p { font-size: 14px; line-height: 1.6; color: #64748b; max-width: 40ch; margin: 4px 0 0; }
  body.is-dark p { color: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    body:not(.is-light) p { color: #94a3b8; }
  }
  button {
    margin-top: 20px; font: inherit; font-size: 14px; font-weight: 700; color: #fff;
    background: #122d4b; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  body.is-dark button { background: #38bdf8; color: #0f172a; }
  @media (prefers-color-scheme: dark) {
    body:not(.is-light) button { background: #38bdf8; color: #0f172a; }
  }
  button:active { transform: scale(0.97); }
</style>
<script>
  // Apply the app's saved theme before paint so the offline shell matches the
  // dashboard (localStorage wins over prefers-color-scheme).
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('boot-dark');
      } else if (t === 'light') {
        document.documentElement.classList.add('boot-light');
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <img id="offlineLogo" src="/static/BR_Logo.png" alt="BR Fantasy">
  <p class="brand">BR Fantasy</p>
  <h1>You're offline</h1>
  <p>We can't reach BR Fantasy right now. Check your connection and try again. Pages you've
  already opened stay available.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <script>
    (function () {
      var dark = document.documentElement.classList.contains('boot-dark')
        || (!document.documentElement.classList.contains('boot-light')
            && window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (document.documentElement.classList.contains('boot-light')) dark = false;
      document.body.classList.toggle('is-dark', dark);
      document.body.classList.toggle('is-light', !dark);
      var logo = document.getElementById('offlineLogo');
      if (logo) logo.src = dark ? '/static/BR_Logo_dark.png' : '/static/BR_Logo.png';
      var meta = document.getElementById('br-theme-color');
      if (meta) meta.setAttribute('content', dark ? '#020617' : '#f8fafc');
    })();
    // Auto-retry the moment the connection returns, so the user doesn't have to.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
