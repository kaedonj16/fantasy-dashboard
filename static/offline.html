<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="br-theme-color" content="#0b2036">
<title>Offline · BR Fantasy</title>
<style>
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("/static/fonts/web/archivo-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("/static/fonts/web/archivo-700.woff2") format("woff2");
  }
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("/static/fonts/web/archivo-800.woff2") format("woff2");
  }
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Archivo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 6px; padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: #ffffff;
    color: #122d4b;
  }
  body.is-dark {
    background: #020617;
    color: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    body:not(.is-light) {
      background: #020617;
      color: #e2e8f0;
    }
  }
  .brand {
    margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase; color: #3b82f6;
  }
  img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; font-weight: 800; }
  p { font-size: 14px; line-height: 1.6; color: #64748b; max-width: 40ch; margin: 4px 0 0; }
  body.is-dark p { color: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    body:not(.is-light) p { color: #94a3b8; }
  }
  button {
    margin-top: 20px; font: inherit; font-size: 14px; font-weight: 700; color: #fff;
    background: #122d4b; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  body.is-dark button { background: #38bdf8; color: #0f172a; }
  @media (prefers-color-scheme: dark) {
    body:not(.is-light) button { background: #38bdf8; color: #0f172a; }
  }
  button:active { transform: scale(0.97); }
</style>
<script>
  // Apply the app's saved theme before paint so the offline shell matches the
  // dashboard (localStorage wins over prefers-color-scheme).
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('boot-dark');
      } else if (t === 'light') {
        document.documentElement.classList.add('boot-light');
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <img id="offlineLogo" src="/static/BR_Logo.png" alt="BR Fantasy">
  <p class="brand">BR Fantasy</p>
  <h1 id="offlineTitle">You're offline</h1>
  <p id="offlineCopy">We can't reach BR Fantasy right now. Check your connection and try again. Pages you've
  already opened stay available.</p>
  <button type="button" id="offlineRetry" onclick="location.reload()">Try again</button>
  <script>
    (function () {
      var dark = document.documentElement.classList.contains('boot-dark')
        || (!document.documentElement.classList.contains('boot-light')
            && window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (document.documentElement.classList.contains('boot-light')) dark = false;
      document.body.classList.toggle('is-dark', dark);
      document.body.classList.toggle('is-light', !dark);
      var logo = document.getElementById('offlineLogo');
      if (logo) logo.src = dark ? '/static/BR_Logo_dark.png' : '/static/BR_Logo.png';
      var meta = document.getElementById('br-theme-color');
      if (meta) meta.setAttribute('content', dark ? '#020617' : '#f8fafc');

      // The SW can serve this shell on a slow-but-online timeout. Don't claim
      // the user is offline when navigator.onLine says otherwise — show a
      // connecting message and keep retrying until the origin answers.
      var title = document.getElementById('offlineTitle');
      var copy = document.getElementById('offlineCopy');
      var retryBtn = document.getElementById('offlineRetry');
      var retryTimer = null;
      function paintCopy() {
        var online = !(typeof navigator !== 'undefined' && navigator.onLine === false);
        document.title = online ? 'Connecting · BR Fantasy' : 'Offline · BR Fantasy';
        if (title) title.textContent = online ? 'Still connecting…' : "You're offline";
        if (copy) {
          copy.textContent = online
            ? "You're online, but BR Fantasy is taking longer than usual. We'll keep trying."
            : "We can't reach BR Fantasy right now. Check your connection and try again. Pages you've already opened stay available.";
        }
        if (retryBtn) retryBtn.textContent = online ? 'Retry now' : 'Try again';
        return online;
      }
      function scheduleRetry(online) {
        if (retryTimer) clearTimeout(retryTimer);
        if (!online) return;
        retryTimer = setTimeout(function () { location.reload(); }, 2500);
      }
      scheduleRetry(paintCopy());
      window.addEventListener('online', function () {
        scheduleRetry(paintCopy());
      });
      window.addEventListener('offline', function () {
        scheduleRetry(paintCopy());
      });
      // The SW serves this shell when a PWA navigation times out with nothing
      // cached. When the in-flight network fetch later succeeds it posts
      // nav-fresh — reload so the real page replaces this placeholder.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (e) {
          var d = e.data || {};
          if (d.type === 'nav-fresh') location.reload();
        });
      }
    })();
  </script>
</body>
</html>
